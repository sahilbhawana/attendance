services:
  - type: web
    name: classmark-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: classmark-attendance-db
          property: connectionString
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: LOCATION_REQUIRED
        value: "true"
      - key: GPS_RADIUS_METERS
        value: "50"
      - key: QR_VALIDITY_MINUTES
        value: "5"
      - key: QR_ROTATE_SECONDS
        value: "15"
      - key: SUBJECT_COOLDOWN_HOURS
        value: "12"

databases:
  - name: classmark-attendance-db
    plan: free
    databaseName: classmark
    user: classmark
